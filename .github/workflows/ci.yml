name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end & accessibility tests
        run: pnpm test:e2e
        env:
          UPSTASH_REDIS_REST_URL: ""
          UPSTASH_REDIS_REST_TOKEN: ""
          KV_REST_API_URL: ""
          KV_REST_API_TOKEN: ""
          HOHO_IP_SALT: ci-test-salt
          HOHO_STORE_FILE: /tmp/hoho-ci-e2e.json

      - name: Lighthouse CI budgets
        run: pnpm lhci
        env:
          HOSTNAME: localhost
          PORT: "3000"
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          HOHO_IP_SALT: ci-test-salt
          UPSTASH_REDIS_REST_URL: ""
          UPSTASH_REDIS_REST_TOKEN: ""
          KV_REST_API_URL: ""
          KV_REST_API_TOKEN: ""
          HOHO_STORE_FILE: /tmp/hoho-ci-lhci.json
