name: Bug Report
description: Report a rendering, mobile sheet, privacy, or API issue in Hoho.xo
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! If this is a **security or privacy vulnerability**, please follow [SECURITY.md](../../SECURITY.md) instead of filing a public issue.
  - type: input
    id: url
    attributes:
      label: URL or Environment
      description: Live production site or local build details
      placeholder: https://hoho-xo.vercel.app or local Next.js dev
    validations:
      required: true
  - type: dropdown
    id: viewport
    attributes:
      label: Viewport / Device
      options:
        - Desktop (1440×900 or wider)
        - Tablet (768×1024)
        - Mobile Portrait (390×844 / iOS Safari / Android Chrome)
        - API / Backend
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Open `/`
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. Actual Behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console Errors or Screenshots
      description: Paste any browser console errors, network status codes, or attach screenshots.
